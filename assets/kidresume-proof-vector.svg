<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="620" viewBox="0 0 1600 620" role="img" aria-labelledby="title desc">
<title id="title">KidResume proof vector</title><desc id="desc">A formal visual proof of the product path from user facts to downloadable files</desc>
<defs>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#111" stroke-opacity=".10" stroke-width="1"/></pattern>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L9 3L0 6Z" fill="#111"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#111} .mono{font-family:'Courier New',monospace} .label{font-size:18px;font-weight:700;letter-spacing:2px} .small{font-size:16px} .contour{fill:none;stroke:#111;stroke-width:1.5} .vector{fill:none;stroke:#111;stroke-width:2;marker-end:url(#arrow)}</style>
</defs><rect width="1600" height="620" fill="#f8f8f5"/><rect width="1600" height="620" fill="url(#grid)"/><text x="70" y="75" class="label">THE RESUME TRANSFORMATION</text><text x="70" y="120" class="mono" font-size="21">y = R(Q(E(x₀)))   subject to: fabrication = 0, payment verified = 1, owner(session) = true</text><circle cx="95" cy="300" r="78" fill="#f8f8f5" stroke="#111" stroke-width="3"/><circle cx="95" cy="300" r="60" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4 7"/><text x="95" y="312" text-anchor="middle" class="mono" font-size="31" font-weight="700">x₀</text><text x="95" y="420" text-anchor="middle" class="label">LEARNER FACTS</text><text x="95" y="455" text-anchor="middle" class="small">closed-world input</text><path d="M177 300H329" class="vector"/><text x="255.0" y="278" text-anchor="middle" class="mono" font-size="16">T1</text><circle cx="415" cy="300" r="78" fill="#f8f8f5" stroke="#111" stroke-width="3"/><circle cx="415" cy="300" r="60" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4 7"/><text x="415" y="312" text-anchor="middle" class="mono" font-size="31" font-weight="700">E(x)</text><text x="415" y="420" text-anchor="middle" class="label">EVIDENCE</text><text x="415" y="455" text-anchor="middle" class="small">source-linked claims</text><path d="M497 300H649" class="vector"/><text x="575.0" y="278" text-anchor="middle" class="mono" font-size="16">T2</text><circle cx="735" cy="300" r="78" fill="#f8f8f5" stroke="#111" stroke-width="3"/><circle cx="735" cy="300" r="60" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4 7"/><text x="735" y="312" text-anchor="middle" class="mono" font-size="31" font-weight="700">Q(E)</text><text x="735" y="420" text-anchor="middle" class="label">QUALITY GATES</text><text x="735" y="455" text-anchor="middle" class="small">truth + language + layout</text><path d="M817 300H969" class="vector"/><text x="895.0" y="278" text-anchor="middle" class="mono" font-size="16">T3</text><circle cx="1055" cy="300" r="78" fill="#f8f8f5" stroke="#111" stroke-width="3"/><circle cx="1055" cy="300" r="60" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4 7"/><text x="1055" y="312" text-anchor="middle" class="mono" font-size="31" font-weight="700">R(Q)</text><text x="1055" y="420" text-anchor="middle" class="label">RENDER</text><text x="1055" y="455" text-anchor="middle" class="small">deterministic HTML/CSS</text><path d="M1137 300H1289" class="vector"/><text x="1215.0" y="278" text-anchor="middle" class="mono" font-size="16">T4</text><circle cx="1375" cy="300" r="78" fill="#f8f8f5" stroke="#111" stroke-width="3"/><circle cx="1375" cy="300" r="60" fill="none" stroke="#111" stroke-width="1" stroke-dasharray="4 7"/><text x="1375" y="312" text-anchor="middle" class="mono" font-size="31" font-weight="700">y</text><text x="1375" y="420" text-anchor="middle" class="label">OWNED FILES</text><text x="1375" y="455" text-anchor="middle" class="small">PDF + PNG + JSON</text><path d="M70 520H1530" stroke="#111" stroke-width="2"/><text x="70" y="566" class="mono" font-size="18">Invariant: design changes arrangement, never biography.  ∂content/∂whitespace = 0</text></svg>